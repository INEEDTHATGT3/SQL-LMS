services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: sql_lms_harness
    ports:
      - "55432:5432"
    volumes:
      - harness_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d sql_lms_harness"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  harness_pgdata:
